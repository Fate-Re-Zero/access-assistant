[project]
name = "access-assistant-agent"
version = "0.1.0"
description = "Access Assistant Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
    "fastapi>=0.116.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
    # LangChain 1.0+
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-mcp-adapters>=0.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
access-assistant = "access_assistant.cli:main"
access-assistant-web = "access_assistant.web_api:main"
auth-decrypt = "access_assistant.auth_crypto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_assistant"]

[tool.uv.sources]
access-assistant = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
